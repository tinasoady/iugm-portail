name: CI/CD - Verification, Build & Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    # Base de test dédiée aux tests d'intégration (lib/*.test.ts) : les mêmes
    # migrations Prisma que la prod, sur un service Postgres éphémère propre à
    # ce run — jamais partagé avec une vraie base.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iugm_test
          POSTGRES_PASSWORD: iugm_test
          POSTGRES_DB: iugm_scolarite_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iugm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://iugm_test:iugm_test@localhost:5432/iugm_scolarite_test_db?schema=public"
      AUTH_SECRET: "ci-secret-not-for-production-0000000000000000000000000000000000"

    # Indique à GitHub Actions que le projet est dans le dossier "iugm"
    defaults:
      run:
        working-directory: ./iugm

    steps:
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      - name: 2. Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Installer les dépendances
        run: npm install

      - name: 4. Générer le client Prisma
        run: npx prisma generate

      - name: 5. Vérifier les types TypeScript
        run: npx tsc --noEmit

      - name: 6. Vérifier la qualité du code (ESLint)
        run: npm run lint

      - name: 7. Appliquer les migrations sur la base de test
        run: npx prisma migrate deploy

      - name: 8. Lancer la suite de tests (unitaires + intégration)
        run: npm run test

      - name: 9. Vérifier la compilation Next.js (Build)
        run: npm run build

  deploy:
    name: Déployer sur Vercel (production)
    needs: build-and-check
    # Seulement sur un vrai push vers main (jamais pour une pull request, et
    # jamais si build-and-check a échoué — "needs" bloque déjà ce cas, mais
    # ce garde-fou explicite documente l'intention) : le déploiement continu
    # ne part que si la CI est verte.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./iugm

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      - name: 2. Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Installer le CLI Vercel
        run: npm install --global vercel@latest

      - name: 4. Récupérer la configuration du projet (environnement Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 5. Builder le projet via Vercel (exécute prisma migrate deploy + next build)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 6. Déployer l'artefact déjà construit
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}